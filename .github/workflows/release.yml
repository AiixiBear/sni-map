name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (例: v1.0.0)。空欄なら自動で dev tag を生成'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ========================================================
  # Job 1: 打包主程式（onefile）
  # ========================================================
  build-app:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools==81.0.0
          pip install -r requirements.txt
          pip install pyinstaller==5.13.2

      - name: Build with PyInstaller (onefile)
        shell: pwsh
        run: |
          pyinstaller --onefile --console --clean --noupx `
            --collect-all=playwright `
            --collect-all=customtkinter `
            --hidden-import=greenlet `
            --hidden-import=pyee `
            app.py

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/app.exe")) {
            Write-Error "dist/app.exe not found"
            exit 1
          }
          $size = (Get-Item "dist/app.exe").Length / 1MB
          Write-Host "app.exe size: $size MB"

      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist/app.exe
          retention-days: 7

  # ========================================================
  # Job 2: 打包瀏覽器
  # ========================================================
  build-browsers:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get Playwright version
        id: pw
        shell: bash
        run: |
          V=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $V"

      - name: Cache Playwright browsers
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-win-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Verify browser path
        shell: pwsh
        run: |
          $chromium = Get-ChildItem $env:PLAYWRIGHT_BROWSERS_PATH -Directory | Where-Object { $_.Name -like 'chromium-*' }
          if (-not $chromium) {
            Write-Error "chromium-* not found in $env:PLAYWRIGHT_BROWSERS_PATH"
            exit 1
          }

      - name: Package browsers
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PLAYWRIGHT_BROWSERS_PATH/*" `
                           -DestinationPath "playwright-browsers.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: browsers-windows
          path: playwright-browsers.zip
          retention-days: 7

  # ========================================================
  # Job 3: 上傳 Release
  # ========================================================
  release:
    needs: [build-app, build-browsers]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v0.0.0-dev.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Rename artifacts with tag
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          cd artifacts
          echo "=== Before rename ==="
          ls -lh
          mv app.exe "sni-map-${TAG}-windows.exe"
          mv playwright-browsers.zip "playwright-browsers-${TAG}-windows.zip"
          echo "=== After rename ==="
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## 📦 下載後如何使用

            | 檔案 | 說明 |
            |---|---|
            | `sni-tool-*-windows.exe` | 主程式（onefile，單一 exe） |
            | `playwright-browsers-*-windows.zip` | Chromium 瀏覽器本體（**必須**） |

            ### 使用步驟

            1. 下載**兩個**檔案：`sni-tool-*-windows.exe` 和 `playwright-browsers-*-windows.zip`
            2. 解壓 `playwright-browsers-*-windows.zip` 到 exe 同目錄，資料夾名稱保持為 `playwright-browsers`：
              ```
              sni-tool
              ├── sni-tool-v1.0.0-windows.exe
              └── playwright-browsers
              └── chromium-XXXX\
              ```
            3. 雙擊 exe，程式會自動偵測 `playwright-browsers\`

            > ⚠️ **exe 和瀏覽器必須從同一個 Release 下載**。混用不同版本會啟動失敗。
            >
            > ⏱ **首次啟動需等待 10–30 秒**（onefile 模式解壓到臨時目錄），第二次啟動稍快但仍需幾秒。

            詳細說明請見 [README](../blob/main/README.md)。