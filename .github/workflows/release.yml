name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 也可從 Actions 頁面手動觸發

permissions:
  contents: write

jobs:
  # ========================================================
  # Job 1: 打包主程式（不含瀏覽器）
  # ========================================================
  build-app:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools==81.0.0
          pip install -r requirements.txt
          pip install pyinstaller==5.13.2

      # 這一步不跑 playwright install —— 讓 app zip 不含瀏覽器
      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --console --clean --noupx `
            --collect-all=playwright `
            --collect-all=customtkinter `
            --hidden-import=greenlet `
            --hidden-import=pyee `
            app.py

      - name: Package app
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dist/app/* -DestinationPath "sni-tool-$tag-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: sni-tool-*-windows.zip
          retention-days: 7

  # ========================================================
  # Job 2: 打包 Chromium 瀏覽器
  # ========================================================
  build-browsers:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt   # 只要 playwright，不裝 pyinstaller

      - name: Get Playwright version
        id: pw
        shell: bash
        run: |
          V=$(python -c "import playwright; print(playwright.__version__)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $V"

      - name: Cache Playwright browsers
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-win-${{ steps.pw.outputs.version }}
          # 不設 restore-keys：版本升級時寧可重下，避免版本錯配

      - name: Install Chromium
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Verify browser path
        shell: pwsh
        run: |
          Get-ChildItem $env:PLAYWRIGHT_BROWSERS_PATH | Format-Table Name
          $chromium = Get-ChildItem $env:PLAYWRIGHT_BROWSERS_PATH -Directory | Where-Object { $_.Name -like 'chromium-*' }
          if (-not $chromium) {
            Write-Error "chromium-* not found in $env:PLAYWRIGHT_BROWSERS_PATH"
            exit 1
          }

      - name: Package browsers
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "$env:PLAYWRIGHT_BROWSERS_PATH/*" `
                           -DestinationPath "playwright-browsers-$tag-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: browsers-windows
          path: playwright-browsers-*-windows.zip
          retention-days: 7

  # ========================================================
  # Job 3: 合併上傳 Release
  # ========================================================
  release:
    needs: [build-app, build-browsers]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            ## 📦 下載後如何使用

            1. 下載**兩個** zip：`sni-tool-*-windows.zip` 和 `playwright-browsers-*-windows.zip`
            2. 解壓到**同一個資料夾**（瀏覽器 zip 的內容要放在 `playwright-browsers\` 子目錄）
            3. 雙擊 `app.exe`

            > ⚠️ **兩個 zip 必須從同一次 Release 下載**。混用不同版本會啟動失敗。

            詳細說明請見 [README](../blob/main/README.md)。